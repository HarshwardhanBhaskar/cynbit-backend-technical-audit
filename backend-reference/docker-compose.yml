version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cynbit_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://cynbit:cynbit_pass@db:5432/cynbit_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-key-32-bytes-minimum-length-for-security
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: cynbit_postgres
    environment:
      POSTGRES_USER: cynbit
      POSTGRES_PASSWORD: cynbit_pass
      POSTGRES_DB: cynbit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cynbit -d cynbit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cynbit_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
